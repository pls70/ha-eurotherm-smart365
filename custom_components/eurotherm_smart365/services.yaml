read_registers:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: eurotherm_smart365
    address:
      required: true
      example: 100
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    count:
      default: 1
      selector:
        number:
          min: 1
          max: 1000
          mode: box
